<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اقرأها</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#182033;font-family:Tahoma,Arial}.top{background:linear-gradient(135deg,#514bd6,#7a66ea);color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1000px;margin:30px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7ef;border-radius:22px;padding:26px;margin-bottom:18px;box-shadow:0 10px 30px #17205212}.hero{text-align:center;padding:45px 20px}.hero h1{font-size:38px}.muted{color:#667085}.btn{border:0;border-radius:12px;padding:13px 18px;background:#5954d8;color:#fff;font-weight:700;cursor:pointer}.alt{background:#eef0ff;color:#4f4ac6}.red{background:#fff0f0;color:#b62f2f}.input{width:100%;padding:14px;border:1px solid #d9dce7;border-radius:12px;font:inherit}.progress{height:11px;background:#e8eaf1;border-radius:20px;overflow:hidden}.bar{height:100%;background:#6258dc;width:0;transition:.3s}.word{text-align:center;font-size:58px;font-weight:900;padding:42px 5px}.mic{display:block;margin:10px auto;width:82px;height:82px;border:0;border-radius:50%;background:#5954d8;color:#fff;font-size:30px;cursor:pointer}.on{animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 15px #5954d822}}.feed{text-align:center;padding:14px;border-radius:12px;margin:14px 0;font-weight:700}.ok{background:#e8f8f0;color:#16794f}.bad{background:#fff0f0;color:#b62f2f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.stat{padding:18px;border:1px solid #e5e7ef;border-radius:16px}.row{display:flex;gap:10px;flex-wrap:wrap}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:12px}.hide{display:none!important}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{border:0;padding:11px 15px;border-radius:10px;background:#eef0ff;color:#4f4ac6;font-weight:700}.active{background:#5954d8;color:#fff}.notice{background:#fff8df;padding:12px;border-radius:12px;line-height:1.7}@media(max-width:600px){.hero h1{font-size:29px}.word{font-size:44px}}</style>
<header class="top"><b>📚 اقرأها</b><span id="who"></span></header><main class="wrap">
<section id="login" class="card hero"><h1>منصة تعلّم القراءة العربية</h1><p class="muted">اقرأ واستمع للنموذج واحصل على تقييم فوري.</p><div style="max-width:480px;margin:auto"><input id="name" class="input" placeholder="اسم الطالب"><button class="btn" style="width:100%;margin-top:10px" onclick="studentLogin()">ابدأ القراءة 🚀</button><button class="btn alt" style="width:100%;margin-top:10px" onclick="teacherLogin()">دخول المعلم</button></div><p class="notice">استخدم Chrome أو Edge واسمح بالميكروفون. عند النشر يجب استخدام HTTPS.</p></section>
<section id="read" class="hide"><div class="card"><div class="row" style="justify-content:space-between"><div><b id="level"></b><h2 id="title"></h2></div><button class="btn alt" onclick="location.reload()">خروج</button></div><div class="progress"><div id="bar" class="bar"></div></div><p id="count" class="muted"></p><div id="target" class="word"></div><p id="prompt" class="muted" style="text-align:center">اضغط الميكروفون واقرأ بصوت واضح</p><div id="feed"></div><button id="mic" class="mic" onclick="listen()">🎙️</button><div class="row" style="justify-content:center;margin-top:18px"><button class="btn alt" onclick="speak()">🔊 اسمع</button><button class="btn red" onclick="retry()">↻ إعادة</button></div></div></section>
<section id="teacher" class="hide"><div class="card"><div class="tabs"><button class="tab active" onclick="tab('dash',this)">الطلاب</button><button class="tab" onclick="tab('content',this)">المحتوى</button><button class="tab" onclick="location.reload()">خروج</button></div><div id="dash"></div><div id="content" class="hide"></div></div></section></main>
<script>
let levels=[],student,rec;
const $=x=>document.getElementById(x);
async function api(p,o={}){let r=await fetch(p,{credentials:"include",headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function studentLogin(){try{let d=await api("/api/student/login",{method:"POST",body:JSON.stringify({name:$("name").value})});student=d.student;levels=(await api("/api/levels")).levels;$("login").classList.add("hide");$("read").classList.remove("hide");$("who").textContent=student.name;render()}catch(e){alert(e.message)}}
function render(){let L=levels.find(x=>x.id===student.level)||levels[0];if(!L)return done();$("level").textContent="المستوى "+L.id;$("title").textContent=L.title;$("target").textContent=L.items[student.item];$("count").textContent=`${student.item+1} من ${L.items.length}`;$("bar").style.width=(student.item/L.items.length*100)+"%";$("feed").innerHTML="";$("prompt").textContent="اضغط الميكروفون واقرأ بصوت واضح"}
function norm(s){return String(s||"").toLowerCase().replace(/[ًٌٍَُِّْـ]/g,"").replace(/[.,،؛!?؟:"']/g,"").replace(/\s+/g," ").trim()}
function sim(a,b){a=norm(a);b=norm(b);if(a===b)return 1;if(!a||!b)return 0;let A=[...a],B=[...b],d=Array(A.length+1).fill(0).map(()=>Array(B.length+1).fill(0));for(let i=0;i<=A.length;i++)d[i][0]=i;for(let j=0;j<=B.length;j++)d[0][j]=j;for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return 1-d[A.length][B.length]/Math.max(A.length,B.length)}
function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $("feed").innerHTML='<div class="feed bad">المتصفح لا يدعم التعرف على الصوت. استخدم Chrome أو Edge.</div>';rec=new SR();rec.lang="ar-SA";rec.interimResults=false;rec.maxAlternatives=3;$("mic").classList.add("on");$("prompt").textContent="أستمع إليك…";rec.onresult=async e=>{let hs=[...e.results[0]].map(x=>x.transcript),target=$("target").textContent,score=Math.max(...hs.map(x=>sim(x,target))),ok=score>=.84; $("prompt").textContent="سمعت: «"+hs[0]+"»";await api("/api/student/result",{method:"POST",body:JSON.stringify({level:student.level,item:student.item,target,heard:hs[0],score,correct:ok})});if(ok){$("feed").innerHTML='<div class="feed ok">✅ أحسنت! قراءة صحيحة.</div>';let old={level:student.level,item:student.item};student=(await api("/api/student/me")).student;setTimeout(()=>{if(student.level===old.level&&student.item===old.item)done();else render()},700)}else $("feed").innerHTML='<div class="feed bad">❌ خطأ. حاول مرة أخرى، ولا يمكنك الانتقال حتى تقرأها بشكل صحيح.</div>'};rec.onerror=()=>{$("feed").innerHTML='<div class="feed bad">تعذر سماع القراءة. تحقق من الميكروفون.</div>'};rec.onend=()=>$("mic").classList.remove("on");rec.start()}
function speak(){
  const text=$("target").textContent.trim();
  if(!text)return;
  const synth=window.speechSynthesis;
  if(!synth){
    $("feed").innerHTML='<div class="feed bad">المتصفح لا يدعم تشغيل الصوت. استخدم Chrome أو Edge.</div>';
    return;
  }
  const play=()=>{
    const voices=synth.getVoices();
    const ar=voices.filter(v=>/^ar(-|$)/i.test(v.lang));
    const voice=ar.find(v=>/^ar-SA$/i.test(v.lang))
      || ar.find(v=>/Arabic|العربية/i.test(v.name))
      || ar[0]
      || null;
    synth.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=voice ? voice.lang : "ar-SA";
    if(voice) u.voice=voice;
    u.rate=.72;
    u.pitch=1;
    u.volume=1;
    u.onstart=()=>{$("prompt").textContent="🔊 أستمع للنطق الصحيح…"};
    u.onend=()=>{$("prompt").textContent="اضغط الميكروفون واقرأ بصوت واضح"};
    u.onerror=()=>{$("feed").innerHTML='<div class="feed bad">تعذر تشغيل الصوت. تأكد من أن صوت الجهاز غير مكتوم ثم جرّب Chrome أو Edge.</div>'};
    synth.speak(u);
  };
  if(synth.getVoices().length) play();
  else {
    synth.onvoiceschanged=()=>{synth.onvoiceschanged=null;play()};
    setTimeout(play,500);
  }
}
function retry(){$("feed").innerHTML="";$("prompt").textContent="حاول مرة أخرى أو اسمع النموذج."}
function done(){$("read").innerHTML='<div class="card hero"><h1>🏆 ممتاز!</h1><p>أكملت جميع المستويات الحالية بنجاح.</p><button class="btn" onclick="location.reload()">العودة</button></div>'}
async function teacherLogin(){let u=prompt("اسم مستخدم المعلم"),p=prompt("كلمة مرور المعلم");if(!u||!p)return;try{await api("/api/teacher/login",{method:"POST",body:JSON.stringify({username:u,password:p})});$("login").classList.add("hide");$("teacher").classList.remove("hide");loadDash()}catch(e){alert(e.message)}}
async function loadDash(){let d=await api("/api/teacher/dashboard");$("dash").innerHTML="<h2>لوحة المعلم</h2><div class=grid>"+(d.students.length?d.students.map(s=>`<div class=stat><b>${esc(s.name)}</b><p>المستوى: ${s.level}</p><p>الصحيح: ${s.correct} | الأخطاء: ${s.errors}</p><p>المحاولات: ${s.attempts}</p><button class="btn red" onclick="resetS('${encodeURIComponent(s.name)}')">تصفير التقدم</button></div>`).join(""):"<p class=muted>لا يوجد طلاب بعد.</p>")+"</div>"}
async function loadContent(){let d=await api("/api/teacher/dashboard");$("content").innerHTML="<h2>إدارة المحتوى</h2>"+d.levels.map(l=>`<div class=card><h3>${l.title}</h3>${l.items.map((x,i)=>`<div class=item><span>${esc(x)}</span><button class="btn red" onclick="del(${l.id},${i})">حذف</button></div>`).join("")}<div class=row><input id=n${l.id} class=input placeholder="أضف كلمة أو جملة"><button class=btn onclick="add(${l.id})">إضافة</button></div></div>`).join("");$("dash").classList.add("hide");$("content").classList.remove("hide")}
function tab(t,b){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");t==="dash"?( $("content").classList.add("hide"),$("dash").classList.remove("hide"),loadDash()):loadContent()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function add(id){let v=$("n"+id).value.trim();if(v){await api("/api/teacher/levels",{method:"POST",body:JSON.stringify({id,text:v})});loadContent()}}
async function del(level,index){if(confirm("حذف العنصر؟")){await api("/api/teacher/item",{method:"DELETE",body:JSON.stringify({level,index})});loadContent()}}
async function resetS(name){if(confirm("تصفير تقدم الطالب؟")){await api("/api/teacher/reset-student",{method:"POST",body:JSON.stringify({name:decodeURIComponent(name)})});loadDash()}}
</script></html>
